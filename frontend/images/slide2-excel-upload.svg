<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="floatShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Glow & Pedestal -->
  <circle cx="270" cy="240" r="190" fill="#ecfdf5" opacity="0.7" />
  <ellipse cx="270" cy="440" rx="210" ry="28" fill="#e2e8f0" opacity="0.6" />

  <!-- Main 3D Card: Excel Marks Upload & Import Engine -->
  <g filter="url(#floatShadow)" transform="translate(60, 45)">
    <rect x="0" y="0" width="420" height="380" rx="26" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="4" />

    <!-- Card Top Header -->
    <rect x="22" y="22" width="376" height="54" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="36" y="36" width="30" height="26" rx="6" fill="url(#excelGreen)" />
    <text x="51" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">X</text>
    <text x="76" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#111827">Internal Marks Spreadsheet Import</text>
    <text x="76" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748b">Batch: B.Tech CSE Section A • Semester 5</text>

    <!-- Drag & Drop Upload Zone -->
    <rect x="22" y="90" width="376" height="150" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="6 6" />
    
    <circle cx="210" cy="140" r="28" fill="#dcfce7" />
    <path d="M210 125 L210 152 M198 137 L210 125 L222 137" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="210" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#15803d" text-anchor="middle">Drag &amp; Drop .XLSX File or Browse</text>
    <text x="210" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#4ade80" text-anchor="middle">Pre-formatted Department Assessment Template</text>

    <!-- Spreadsheet Verification Status Table -->
    <rect x="22" y="254" width="376" height="106" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Row 1 -->
    <circle cx="42" cy="280" r="8" fill="#10b981" />
    <text x="42" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="60" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#1e293b">60 Student Records Parsed</text>
    <rect x="310" y="268" width="76" height="24" rx="6" fill="#ecfdf5" />
    <text x="348" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="middle">Validated</text>

    <!-- Row 2 -->
    <circle cx="42" cy="312" r="8" fill="#10b981" />
    <text x="42" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="60" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#1e293b">Zero Duplicate Register IDs</text>
    <rect x="310" y="300" width="76" height="24" rx="6" fill="#ecfdf5" />
    <text x="348" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="middle">Passed</text>

    <!-- Row 3 -->
    <circle cx="42" cy="344" r="8" fill="#f59e0b" />
    <text x="42" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="60" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#1e293b">PostgreSQL Atomic Transaction Ready</text>
    <rect x="310" y="332" width="76" height="24" rx="6" fill="#fef3c7" />
    <text x="348" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#d97706" text-anchor="middle">Commit</text>
  </g>

  <!-- Floating 3D Excel Badge -->
  <g filter="url(#floatShadow)" transform="translate(415, 25)">
    <rect x="0" y="0" width="85" height="70" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2.5" />
    <rect x="12" y="12" width="60" height="28" rx="8" fill="url(#excelGreen)" />
    <text x="42" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">EXCEL</text>
    <text x="42" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#111827" text-anchor="middle">Auto-Sync</text>
  </g>
</svg>