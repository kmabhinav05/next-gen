<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="softTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa68c" />
      <stop offset="100%" stop-color="#207e69" />
    </linearGradient>
    <linearGradient id="pdfRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="floatShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Glow & Pedestal -->
  <circle cx="270" cy="240" r="190" fill="#ecfdf5" opacity="0.6" />
  <ellipse cx="270" cy="440" rx="210" ry="28" fill="#e2e8f0" opacity="0.6" />

  <!-- Main 3D Card: Official Digital Progress Card -->
  <g filter="url(#floatShadow)" transform="translate(60, 45)">
    <rect x="0" y="0" width="420" height="380" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Progress Card Header -->
    <rect x="22" y="22" width="376" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    
    <circle cx="54" cy="52" r="18" fill="url(#softTeal)" />
    <text x="54" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">PTM</text>

    <text x="84" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#111827">STUDENT PROGRESS REPORT</text>
    <text x="84" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748b">Department of Computer Science &amp; Engineering</text>

    <rect x="306" y="38" width="76" height="26" rx="8" fill="#dcfce7" />
    <text x="344" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#15803d" text-anchor="middle">OFFICIAL</text>

    <!-- Student Metadata Box -->
    <rect x="22" y="94" width="376" height="54" rx="10" fill="#f8fafc" />
    <text x="36" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#64748b">STUDENT NAME:</text>
    <text x="126" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#111827">Alex Turner</text>
    <text x="240" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#64748b">REG NO:</text>
    <text x="290" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#111827">REG2023CSE001</text>
    
    <text x="36" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#64748b">GUARDIAN:</text>
    <text x="100" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#111827">Robert Turner</text>
    <text x="240" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#64748b">ATTENDANCE:</text>
    <text x="325" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#16a34a">94.2% (Eligible)</text>

    <!-- Table Rows Mock -->
    <rect x="22" y="160" width="376" height="34" rx="8" fill="#f1f5f9" />
    <text x="36" y="181" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#1e293b">CS501 Database Engineering</text>
    <text x="270" y="181" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">48/50</text>
    <text x="345" y="181" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#16a34a">Grade O</text>

    <rect x="22" y="202" width="376" height="34" rx="8" fill="#ffffff" />
    <text x="36" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#1e293b">CS502 Operating Systems</text>
    <text x="270" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">46/50</text>
    <text x="345" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#16a34a">Grade A+</text>

    <rect x="22" y="244" width="376" height="34" rx="8" fill="#f1f5f9" />
    <text x="36" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#1e293b">CS503 Theory of Computation</text>
    <text x="270" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">44/50</text>
    <text x="345" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#16a34a">Grade A+</text>

    <!-- HOD Verified Seal & Remarks -->
    <g transform="translate(260, 292)">
      <circle cx="35" cy="35" r="28" fill="url(#warmAmber)" />
      <circle cx="35" cy="35" r="23" fill="#ffffff" opacity="0.2" />
      <text x="35" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Signature and Date -->
    <line x1="36" y1="335" x2="160" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="36" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#64748b">Head of Department (CSE)</text>

    <rect x="330" y="310" width="68" height="42" rx="10" fill="url(#pdfRed)" />
    <text x="364" y="336" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">PDF</text>
  </g>

  <!-- 3D Floating Download Pill -->
  <g filter="url(#floatShadow)" transform="translate(415, 25)">
    <rect x="0" y="0" width="90" height="70" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="2.5" />
    <circle cx="45" cy="28" r="14" fill="url(#pdfRed)" />
    <text x="45" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">PDF</text>
    <text x="45" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#111827" text-anchor="middle">Download</text>
  </g>
</svg>