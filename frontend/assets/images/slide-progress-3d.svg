<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#0d9488" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="180" fill="#d1fae5" opacity="0.6" />

  <!-- Pedestal -->
  <ellipse cx="250" cy="420" rx="190" ry="32" fill="#e2e8f0" opacity="0.7" />

  <!-- Digital Progress Certificate Card -->
  <g filter="url(#shadow3)" transform="translate(90, 45)">
    <rect x="0" y="0" width="320" height="385" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    
    <!-- Header Banner -->
    <rect x="24" y="24" width="272" height="50" rx="14" fill="url(#tealLight)" />
    <circle cx="52" cy="49" r="14" fill="#3aa68c" />
    <text x="52" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">PTM</text>
    <text x="80" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#111827">Digital Progress Card</text>

    <!-- Student Lines Mock -->
    <rect x="28" y="96" width="140" height="12" rx="6" fill="#0f172a" />
    <rect x="28" y="118" width="90" height="8" rx="4" fill="#94a3b8" />

    <!-- Table Rows Mock -->
    <rect x="28" y="148" width="264" height="34" rx="8" fill="#f8fafc" />
    <rect x="40" y="160" width="100" height="10" rx="5" fill="#334155" />
    <rect x="220" y="158" width="55" height="14" rx="6" fill="#d1fae5" />

    <rect x="28" y="192" width="264" height="34" rx="8" fill="#ffffff" />
    <rect x="40" y="204" width="120" height="10" rx="5" fill="#334155" />
    <rect x="220" y="202" width="55" height="14" rx="6" fill="#d1fae5" />

    <rect x="28" y="236" width="264" height="34" rx="8" fill="#f8fafc" />
    <rect x="40" y="248" width="110" height="10" rx="5" fill="#334155" />
    <rect x="220" y="246" width="55" height="14" rx="6" fill="#d1fae5" />

    <!-- Official Gold Seal -->
    <g transform="translate(205, 285)">
      <circle cx="42" cy="42" r="32" fill="url(#sealGrad)" />
      <circle cx="42" cy="42" r="26" fill="#ffffff" opacity="0.2" />
      <text x="42" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Signature Line -->
    <line x1="35" y1="325" x2="140" y2="325" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
    <text x="35" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748b">HOD Signature</text>
  </g>

  <!-- Floating PDF Download Pill -->
  <g filter="url(#shadow3)" transform="translate(50, 315)">
    <rect x="0" y="0" width="125" height="52" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="28" cy="26" r="14" fill="url(#pdfGrad)" />
    <text x="28" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">PDF</text>
    <text x="56" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">1-Click PTM</text>
  </g>
</svg>