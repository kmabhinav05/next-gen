    <text x="80" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3aa68c" text-anchor="middle" letter-spacing="0.05em">SPREADSHEET IO</text>
  </g>

  <!-- Main Icon Bubble -->
  <g filter="url(#sh2)" transform="translate(340, 145)">
    <rect width="120" height="120" rx="32" fill="#3aa68c"/>
    <!-- Excel Document Icon -->
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 7V3.5L18.5 8H15zM8 11h2.5l1.5 2.5 1.5-2.5H16l-2.25 3.5L16 18h-2.5l-1.5-2.5-1.5 2.5H8l2.25-3.5L8 11z" fill="#ffffff" transform="translate(24, 24) scale(3)"/>
