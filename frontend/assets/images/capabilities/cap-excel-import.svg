  <!-- Typography -->
  <text x="400" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Excel Marks Import</text>
  <text x="400" y="380" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">Pre-formatted class spreadsheets with drag-and-drop upload,</text>
  <text x="400" y="405" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">automated row validation, and database transaction safety.</text>

