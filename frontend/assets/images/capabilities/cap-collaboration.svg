<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b2c"/>
      <stop offset="50%" stop-color="#19121d"/>
      <stop offset="100%" stop-color="#0c070f"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="36" fill="url(#bg5)" stroke="rgba(245,158,11,0.25)" stroke-width="2"/>
  <circle cx="400" cy="220" r="280" fill="url(#glow5)"/>

  <!-- Matrix Background Dots -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="90" cy="90" r="3"/><circle cx="130" cy="90" r="3"/><circle cx="170" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="130" cy="130" r="3"/><circle cx="170" cy="130" r="3"/>
    <circle cx="630" cy="470" r="3"/><circle cx="670" cy="470" r="3"/><circle cx="710" cy="470" r="3"/>
    <circle cx="630" cy="510" r="3"/><circle cx="670" cy="510" r="3"/><circle cx="710" cy="510" r="3"/>
  </g>

  <!-- Capability Pill -->
  <g transform="translate(320, 80)">
    <rect width="160" height="36" rx="18" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.05em">PTM PORTAL</text>
  </g>

  <!-- Main Icon Bubble -->
  <g filter="url(#sh5)" transform="translate(340, 145)">
    <rect width="120" height="120" rx="32" fill="#f59e0b"/>
    <!-- Parent-Teacher Icon -->
    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="#ffffff" transform="translate(24, 24) scale(3)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Parent–Teacher Collaboration</text>
  <text x="400" y="380" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">Dedicated parent portal to track student attendance and performance,</text>
  <text x="400" y="405" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">eliminating communication gaps before PTM conferences.</text>

  <!-- Bottom CTA Tag -->
  <g transform="translate(280, 470)">
    <rect width="240" height="48" rx="24" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    <text x="120" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">🤝 Transparent Academic Sync</text>
  </g>
</svg>
