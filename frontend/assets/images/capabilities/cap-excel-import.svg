<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162e28"/>
      <stop offset="50%" stop-color="#111f1d"/>
      <stop offset="100%" stop-color="#091412"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3aa68c" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3aa68c" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3aa68c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="36" fill="url(#bg2)" stroke="rgba(58,166,140,0.25)" stroke-width="2"/>
  <circle cx="400" cy="220" r="280" fill="url(#glow2)"/>

  <!-- Matrix Background Dots -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="90" cy="90" r="3"/><circle cx="130" cy="90" r="3"/><circle cx="170" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="130" cy="130" r="3"/><circle cx="170" cy="130" r="3"/>
    <circle cx="630" cy="470" r="3"/><circle cx="670" cy="470" r="3"/><circle cx="710" cy="470" r="3"/>
    <circle cx="630" cy="510" r="3"/><circle cx="670" cy="510" r="3"/><circle cx="710" cy="510" r="3"/>
  </g>

  <!-- Capability Pill -->
  <g transform="translate(320, 80)">
