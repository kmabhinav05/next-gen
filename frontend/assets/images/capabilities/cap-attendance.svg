<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f18"/>
      <stop offset="50%" stop-color="#1c140e"/>
      <stop offset="100%" stop-color="#0c0906"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="36" fill="url(#bg3)" stroke="rgba(245,158,11,0.25)" stroke-width="2"/>
  <circle cx="400" cy="220" r="280" fill="url(#glow3)"/>

  <!-- Matrix Background Dots -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="90" cy="90" r="3"/><circle cx="130" cy="90" r="3"/><circle cx="170" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="130" cy="130" r="3"/><circle cx="170" cy="130" r="3"/>
    <circle cx="630" cy="470" r="3"/><circle cx="670" cy="470" r="3"/><circle cx="710" cy="470" r="3"/>
    <circle cx="630" cy="510" r="3"/><circle cx="670" cy="510" r="3"/><circle cx="710" cy="510" r="3"/>
  </g>

  <!-- Capability Pill -->
  <g transform="translate(320, 80)">
    <rect width="160" height="36" rx="18" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.05em">LIVE AUDIT</text>
  </g>

  <!-- Main Icon Bubble -->
  <g filter="url(#sh3)" transform="translate(340, 145)">
    <rect width="120" height="120" rx="32" fill="#f59e0b"/>
    <!-- Attendance / Clipboard User Icon -->
    <path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V8h14v11zm-7-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0-6a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#ffffff" transform="translate(24, 24) scale(3)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Attendance Tracking</text>
  <text x="400" y="380" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">Subject-wise period tracking calculates attendance in real time,</text>
  <text x="400" y="405" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">automatically triggering condonation shortage alerts when below 75%.</text>

  <!-- Bottom CTA Tag -->
  <g transform="translate(280, 470)">
    <rect width="240" height="48" rx="24" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    <text x="120" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">📅 Real-time Condonation</text>
  </g>
</svg>
