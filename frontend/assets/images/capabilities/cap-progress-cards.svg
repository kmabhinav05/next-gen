<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh1" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card Body with Vibrant Neon Border -->
  <rect width="800" height="600" rx="42" fill="url(#bg1)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="400" cy="200" r="320" fill="url(#glow1)"/>

  <!-- Matrix Background Accents -->
  <g opacity="0.18" fill="#ffffff">
    <circle cx="80" cy="80" r="4"/><circle cx="120" cy="80" r="4"/><circle cx="160" cy="80" r="4"/>
    <circle cx="80" cy="120" r="4"/><circle cx="120" cy="120" r="4"/><circle cx="160" cy="120" r="4"/>
    <circle cx="640" cy="480" r="4"/><circle cx="680" cy="480" r="4"/><circle cx="720" cy="480" r="4"/>
    <circle cx="640" cy="520" r="4"/><circle cx="680" cy="520" r="4"/><circle cx="720" cy="520" r="4"/>
  </g>

  <!-- Top Capability Badge -->
  <g transform="translate(290, 50)">
    <rect width="220" height="42" rx="21" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="2"/>
    <text x="110" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="0.08em">REPORT ENGINE</text>
  </g>

  <!-- Main Icon Bubble -->
  <g filter="url(#sh1)" transform="translate(330, 115)">
    <rect width="140" height="140" rx="36" fill="linear-gradient(135deg, #f59e0b 0%, #d97706 100%)"/>
    <!-- ID Card / Report Icon -->
    <path d="M4 6h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 3v9h16V9H4zm3 2h5v2H7v-2zm0 3h8v2H7v-2zm10-3h3v2h-3v-2z" fill="#ffffff" transform="translate(28, 28) scale(3.5)"/>
  </g>

  <!-- High-Contrast Bold Typography -->
  <text x="400" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.025em">Automated Progress Cards</text>
  <text x="400" y="380" font-family="'Inter', system-ui, sans-serif" font-size="23" font-weight="600" fill="#f8fafc" text-anchor="middle">One-click compilation of internal scores, attendance,</text>
  <text x="400" y="415" font-family="'Inter', system-ui, sans-serif" font-size="23" font-weight="600" fill="#cbd5e1" text-anchor="middle">and faculty remarks into official PDF reports for PTMs.</text>

  <!-- Bottom CTA Pill Tag -->
  <g transform="translate(245, 475)">
    <rect width="310" height="56" rx="28" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>
    <text x="155" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="middle">⚡ Instant PDF Generation</text>
  </g>
</svg>
