<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#301e38"/>
      <stop offset="50%" stop-color="#1f1324"/>
      <stop offset="100%" stop-color="#0c070f"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh5" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card Body with Vibrant Neon Border -->
  <rect width="800" height="600" rx="42" fill="url(#bg5)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="400" cy="200" r="320" fill="url(#glow5)"/>

  <!-- Matrix Background Accents -->
  <g opacity="0.18" fill="#ffffff">
    <circle cx="80" cy="80" r="4"/><circle cx="120" cy="80" r="4"/><circle cx="160" cy="80" r="4"/>
    <circle cx="80" cy="120" r="4"/><circle cx="120" cy="120" r="4"/><circle cx="160" cy="120" r="4"/>
    <circle cx="640" cy="480" r="4"/><circle cx="680" cy="480" r="4"/><circle cx="720" cy="480" r="4"/>
    <circle cx="640" cy="520" r="4"/><circle cx="680" cy="520" r="4"/><circle cx="720" cy="520" r="4"/>
  </g>

  <!-- Top Capability Badge -->
  <g transform="translate(305, 50)">
    <rect width="190" height="42" rx="21" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="2"/>
    <text x="95" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="0.08em">PTM PORTAL</text>
  </g>

  <!-- Main Icon Bubble -->
  <g filter="url(#sh5)" transform="translate(330, 115)">
    <rect width="140" height="140" rx="36" fill="linear-gradient(135deg, #f59e0b 0%, #d97706 100%)"/>
    <!-- Parent-Teacher Icon -->
    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="#ffffff" transform="translate(28, 28) scale(3.5)"/>
  </g>

  <!-- High-Contrast Bold Typography -->
  <text x="400" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.025em">Parent–Teacher Sync</text>
  <text x="400" y="380" font-family="'Inter', system-ui, sans-serif" font-size="23" font-weight="600" fill="#f8fafc" text-anchor="middle">Dedicated parent portal to track student attendance and marks,</text>
  <text x="400" y="415" font-family="'Inter', system-ui, sans-serif" font-size="23" font-weight="600" fill="#cbd5e1" text-anchor="middle">eliminating communication gaps before periodic PTM conferences.</text>

  <!-- Bottom CTA Pill Tag -->
  <g transform="translate(245, 475)">
    <rect width="310" height="56" rx="28" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>
    <text x="155" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="middle">🤝 Transparent Academic Sync</text>
  </g>
</svg>
